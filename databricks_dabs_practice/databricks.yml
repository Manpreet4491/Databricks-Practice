# This is a Declarative Automation Bundle definition for databricks_dab_practice.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_dab_practice
  uuid: d7fe8578-0ee1-470d-9a7c-2eafa96eec39

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-38bddc5d-02cf.cloud.databricks.com
    variables:
      catalog: dev
  uat:
    mode: production
    workspace:
      host: https://dbc-38bddc5d-02cf.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/botmanpreet2021@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/botmanpreet2021@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: uat
    permissions:
      - user_name: botmanpreet2021@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-38bddc5d-02cf.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/botmanpreet2021@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/botmanpreet2021@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
    permissions:
      - user_name: botmanpreet2021@gmail.com
        level: CAN_MANAGE
