resources:
  jobs:
    multihop:
      name: multihop
      tasks:
        - task_key: ingestion_to_bronze
          notebook_task:
            notebook_path: /Workspace/Users/botmanpreet2021@gmail.com/Databricks-Practice/databricks_dabs_practice/src/ingestion
              to bronze
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: bronze_to_silver
          depends_on:
            - task_key: ingestion_to_bronze
          notebook_task:
            notebook_path: /Workspace/Users/botmanpreet2021@gmail.com/Databricks-Practice/databricks_dabs_practice/src/bronze_silver
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: /Workspace/Users/botmanpreet2021@gmail.com/Databricks-Practice/databricks_dabs_practice/src/gold
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
